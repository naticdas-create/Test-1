name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar o projeto Gradle
        id: find
        run: |
          F=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle.kts não encontrado. Estrutura:"; find . -maxdepth 3 -not -path "./.git/*"; exit 1; fi
          D=$(dirname "$F")
          echo "Projeto em: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedVR-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
